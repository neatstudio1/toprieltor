services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toprieltor}
      POSTGRES_USER: ${POSTGRES_USER:-toprieltor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toprieltor}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
